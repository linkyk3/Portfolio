openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: music
    description: Music collection operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /music/collection:
    get:
      operationId: getMusicCollection
      tags: [music]
      summary: Get normalized Discogs collection
      description: Returns recent additions and full collection sorted from newest to oldest.
      responses:
        "200":
          description: Collection data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicCollectionResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MusicCollectionResponse:
      type: object
      properties:
        recentAdditions:
          type: array
          items:
            $ref: "#/components/schemas/MusicCollectionItem"
        fullCollection:
          type: array
          items:
            $ref: "#/components/schemas/MusicCollectionItem"
        total:
          type: integer
        fetchedPages:
          type: integer
      required:
        - recentAdditions
        - fullCollection
        - total
        - fetchedPages
    MusicCollectionItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        year:
          type: integer
          nullable: true
        format:
          type: string
        label:
          type: string
        coverImage:
          type: string
        addedAt:
          type: string
          format: date-time
        discogsUrl:
          type: string
      required:
        - id
        - title
        - artist
        - year
        - format
        - label
        - coverImage
        - addedAt
        - discogsUrl

